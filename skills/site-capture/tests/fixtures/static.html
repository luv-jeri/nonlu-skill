<!doctype html>
<html><head><meta charset="utf-8"><title>Static Editorial Fixture</title>
<style>
  :root { --brand: #0b3d2e; --ground: #fffdf7; --type-scale: 1.25; }
  body { font-family: 'Iowan Old Style', Georgia, serif; background: var(--ground); color: var(--brand); max-width: 40rem; margin: 4rem auto; }
  h1 { font-size: 3rem; } h1::after { content: '.'; color: #c1440e; }
  a:hover { text-decoration-thickness: 3px; }
</style></head>
<body><h1>A quiet page</h1><p>No animation. Custom properties, a pseudo-element, one hover rule.</p><a href="#x">A link</a></body></html>
